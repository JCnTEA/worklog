<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EEE3">
<title>更新總覽・勤務記錄系統</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3EEE3;--card:#FFFDF8;--line:#DDD3BF;--ink:#1C1A16;--dim:#6F675A;
  --green:#1E6B57;--rust:#B4643B;--slate:#3D5A80;--plum:#6B5AA8;--olive:#7A6A2F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(120% 60% at 50% -10%,#FBF7EE,#F3EEE3 62%) fixed,
    repeating-linear-gradient(180deg,rgba(28,26,22,.045) 0 1px,transparent 1px 30px);
  color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 48px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.back{color:var(--dim);text-decoration:none;font-size:12.5px;letter-spacing:.04em}
.live{font:500 11.5px/1.4 "IBM Plex Mono",monospace;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live.on{color:var(--green)}
.live.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}

.brand{display:flex;align-items:center;gap:13px}
.logo{width:58px;height:58px;flex:0 0 auto}
.wm-cn{font:900 26px/1.1 "Noto Sans TC",sans-serif;letter-spacing:.14em}
.wm-sub{margin-top:6px;font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.sub{margin:14px 0 0;font-size:13px;line-height:1.75;color:var(--dim)}
.rule{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:20px 0 6px}

.sec{margin-top:22px}
.sec>h2{display:flex;align-items:center;gap:9px;margin:0 0 12px;font:700 13px/1.4 "IBM Plex Mono",monospace;letter-spacing:.16em;color:var(--ink);text-transform:uppercase}
.sec>h2::before{content:"";width:3px;height:15px;background:var(--green);border-radius:2px}

.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 11px;
box-shadow:0 1px 0 rgba(28,26,22,.04)}
.kpi b{display:block;font:600 20px/1.1 "IBM Plex Mono",monospace;letter-spacing:-.01em}
.kpi span{display:block;margin-top:5px;font-size:11px;color:var(--dim);letter-spacing:.05em}
.kpi .k-date b{font-size:13px;letter-spacing:0}

.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:999px;
padding:6px 13px;font:500 12.5px/1 "Noto Sans TC",sans-serif;cursor:pointer}
.chip.on{background:var(--green);border-color:var(--green);color:#FCFAF4;font-weight:700}
.chip .n{font:500 10.5px/1 "IBM Plex Mono",monospace;opacity:.62;margin-left:5px}
.qwrap{position:relative;margin-top:10px}
.q{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);
padding:11px 13px;font-size:13.5px;outline:none}
.q:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(30,107,87,.1)}
.q::placeholder{color:#A9A193}

.day{margin-top:18px}
.day-h{display:flex;align-items:baseline;gap:9px;margin-bottom:9px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.day-d{font:600 13px/1 "IBM Plex Mono",monospace;letter-spacing:.04em}
.day-n{font-size:11px;color:var(--dim)}
.item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:11px;
padding:11px 13px 12px 15px;margin-bottom:8px;font-size:13.5px;line-height:1.75;word-break:break-word}
.item::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--rust);opacity:.85}
.tag{display:inline-block;font:600 10.5px/1.5 "IBM Plex Mono",monospace;letter-spacing:.04em;
border-radius:5px;padding:1px 6px 2px;margin-right:7px;vertical-align:1px;
background:#EFEAD9;color:#5B5343}
.tag[data-c="修正"]{background:#F6E2D8;color:#9C4E28}
.tag[data-c="優化"]{background:#E3EBF0;color:#33566E}
.tag[data-c="功能"]{background:#DFEFE7;color:#1B6350}
.tag[data-c="新增"]{background:#E8E3F6;color:#554390}
.tag[data-c="自檢"]{background:#F1EBD6;color:#6C5B24}
.tag[data-c="資料"]{background:#EAE7DF;color:#4A4335}
.tag[data-c="移除"]{background:#F3DCDC;color:#8E3B3B}
.chip[data-c="移除"]{border-color:#D9B4B4}
.empty{color:var(--dim);text-align:center;padding:38px 0;font-size:13.5px}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;line-height:1.8}
@media (max-width:360px){.kpi{grid-template-columns:1fr 1fr}.kpi .k-date{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="toprow"><a class="back" href="../">← 勤務系統</a><div class="live" id="liveBar">連線中…</div></div>

  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="勤務日誌">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#28564A"/><stop offset="1" stop-color="#163E34"/>
        </linearGradient>
      </defs>
      <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#bg)"/>
      <rect x="5.5" y="5.5" width="53" height="53" rx="11.5" fill="none" stroke="#E9DCC2" stroke-opacity=".45" stroke-width="1.6"/>
      <rect x="20" y="10" width="18" height="6" rx="3" fill="#E9DCC2" fill-opacity=".92"/>
      <rect x="15" y="15" width="28" height="34" rx="4" fill="#FBF7EE"/>
      <g stroke="#1B4137" stroke-width="2.6" stroke-linecap="round">
        <path d="M21 24h13"/><path d="M21 31h13"/><path d="M21 38h8"/>
      </g>
      <g fill="#B4643B">
        <path d="M44 30a9 9 0 1 0 0 18 9 9 0 0 0 0-18z" fill="#B4643B" fill-opacity=".14"/>
      </g>
      <circle cx="44" cy="39" r="8.4" fill="#FFFDF8" stroke="#B4643B" stroke-width="2"/>
      <path d="M44 34.4V39l3.2 2" stroke="#8E4A25" stroke-width="1.9" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="wm-cn">勤務日誌</div>
      <div class="wm-sub">Worklog · Changelog</div>
    </div>
  </div>
  <p class="sub">從最初到現在，所有改動集中在這一頁。只列內容，不標版本。</p>

  <div class="sec">
    <h2>目前狀態</h2>
    <div class="kpi">
      <div><b id="kTotal">0</b><span>累計更新</span></div>
      <div class="k-date"><b id="kFirst">—</b><span>最早紀錄</span></div>
      <div class="k-date"><b id="kLast">—</b><span>最近更新</span></div>
    </div>
  </div>

  <div class="sec">
    <h2>異動紀錄</h2>
    <div class="tools" id="chips"></div>
    <div class="qwrap"><input class="q" id="q" placeholder="搜尋關鍵字，例如 廁所、GPS、捷運、蝦皮" autocomplete="off"></div>
    <div id="list"></div>
  </div>

  <div class="foot">資料來源：站台更新紀錄（含各版本頁內歷史）。同一天的多筆改動依原文順序陳列；已移除或已被取代的功能仍保留紀錄。本頁每 60 秒自動同步更新資料庫。</div>
</div>
<script>
const DATA = {"rows": [{"date": "2026-11-20", "cat": "其他", "text": "GPS 改成完全手動：開頁不再自動抓位置：原本開頁、切回前景會自動抓 GPS 並自己重算附近店家。改成一律手動：開頁只顯示「尚未定位」，按「取得 GPS 位置／重新定位」才抓一次，抓完列出附近名單店家；不再有自動抓取與背景重算。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "修正", "text": "左上選單鈕捲動時淡出，不再蓋住內文：左上三條槓是固定浮動的，捲到出勤地點或候選清單時會壓住第一筆店名。改成捲動時自動淡到 26%，停手約 1.4 秒再恢復，要看選單時直接點一下也馬上變清楚。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "優化", "text": "捷運資料規則改成開關，預設收起：「資料規則（後台測試用）」6 條說明原本一直攤開佔版面。改成標題右側一個開關，內建關閉、點一下才展開，狀態會記在這台裝置；要看規則再打開就好。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "修正", "text": "實驗版 GPS 附近也改成只列名單店家：實驗版按 GPS 後的附近候選原本抓地圖（OpenStreetMap）隨機店家，會列出清玉、尚品自助餐、霸王紅面薑母鴨這種別人的門牌。改成跟正式版一致：只從內建名單取蝦皮／便利商店／超市／量販／銀行，2 公里內每類最近 3 間、最多 12 間依距離排序，300 公尺內先顯示、其餘收在「更多」。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "新增", "text": "新增下班確認視窗，近期日誌多一欄「下班」：新增可自訂的下班時間（預設 21:00，按「下班 21:00」可改）。到點且今天已有登記時，會彈出「你下班了嗎？」：按「下班了」記錄當下時間、「還沒」30 分鐘後再問、「今天不再提醒」則當天不再跳。記錄的下班時間會顯示在近期日誌最右側「下班」欄。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "修正", "text": "時段記錄改成每個時段固定一列：原本只有按過保存的時段才會出現，只登記下午就只看到 1 段。改成上午／下午／晚上（半夜開啟時多一段）各固定一列，直接顯示該時段排障、會同與合計，沒登記的時段以淡化列顯示 0 件，仍未登記地點顯示「未記錄地點」。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "修正", "text": "正式版 GPS 附近只列名單店家，不再出現別家地址：按 GPS 後的「附近地點」原本抓 OpenStreetMap 隨機店家（阿默蛋糕、臺鐵售票處…），才會列出一堆別人的門牌。改成只從內建名單取：蝦皮智取店／便利商店／超市／量販／銀行，2 公里內每類取最近 3 間、最多 12 間，依距離排序；300 公尺內先顯示，其餘收在「更多」。點選後帶入店名＋門市地址＋座標。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "優化", "text": "更新總覽多一顆分類鈕，可只看被撤下的項目：分類列改成 全部／撤下／修正／優化／功能…，按一下只留下該類並顯示筆數；被撤下的項目在清單上會多一個紅底小標，一眼看出是哪一項被撤。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "更新", "text": "後台 App 重新打包 Bn1.2（版本碼 15）：後台版 App 重新建置並用同一把金鑰簽章，版本碼 14→15；後台首頁的 App 磚塊與版本資訊同步更新，實驗版磚塊標註「含帳號備份」。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "優化", "text": "存檔後自動備份，新裝置登入不會蓋掉舊備份：登入後每存一次檔約 3 秒自動加密上傳，換裝置只要取回；新裝置首次登入若雲端已有備份，會先問「取回／覆蓋」，避免空白資料蓋掉舊紀錄。教學頁與說明同步更新。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "優化", "text": "帳號面板加上「第一次用」三步驟說明，教學頁新增帳號章節：面板內建三個步驟與常見狀況（密碼錯／連線失敗／忘記密碼），使用教學頁新增「帳號與跨裝置」段落，讓沒人帶的人也能自己完成設定。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "優化", "text": "帳號改成「一鍵登入」：沒帳號自動建立：註冊與登入合併為一顆鈕：填帳號密碼按登入，查無帳號就自動註冊後直接登入，少一個步驟。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "新增", "text": "帳號服務正式上線（Cloudflare Worker）：部署 worklog-acct.jcmtea.workers.dev：註冊／登入／上傳／取回皆已實測通過（錯密碼 401、重複註冊 409）；PBKDF2 因 Workers 上限改為 10 萬次迭代。帳號面板已內建服務位址，使用者只需填帳號密碼。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "新增", "text": "新增自建帳號系統（帳密）＋加密紀錄跨裝置：實驗版加入「帳號」面板：自訂帳號密碼註冊／登入，紀錄用密碼派生金鑰 AES-GCM 加密後才上傳，換裝置同帳密按「取回紀錄」即還原。後端為 Cloudflare Worker（tools/acct-worker），GitHub 權杖與簽章金鑰只放在 Worker 環境變數，前端只存服務位址。移除先前的 Google 與倉庫同步。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "修正", "text": "移除帳號與雲端備份（Google 登入、倉庫同步）整組：依使用者決定，實驗版拿掉帳號與備份面板、首頁磚塊、側邊入口與相關程式；隱私權政策同步改為「資料只留本機」。紀錄改為純本機存放。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "功能", "text": "帳號面板加入「倉庫同步」——不靠 Google 也能跨裝置取回：紀錄用 AES-GCM 加密（PBKDF2 派生金鑰）後存進 GitHub 倉庫 sync/.json，只看到亂碼；換手機或電腦填同一組「同步碼＋密碼」按倉庫取回即還原。設定含倉庫、存取權杖、同步碼（可一鍵產生）、密碼，存本機記憶。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "優化", "text": "雲端備份改成看得到的 Worklog 資料夾：改用 drive.file 授權，備份會出現在「我的雲端硬碟 → Worklog → worklog-backup.json」，可自行開啟、下載或刪除；換裝置同帳號登入按「從雲端還原」即回填。面板備份完成後多一個「在雲端硬碟查看」連結。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "新增", "text": "新增隱私權政策與服務條款頁：新增 /terms/：一份共用條款，涵蓋網頁（含 iOS Safari）、Android APK 與電腦版，寫明資料只留本機、Google 登入只用 drive.appdata 隱藏資料夾、撤回授權與刪除方式；同時列出可填進 Google 同意畫面的三個網址。", "state": "完成", "src": "updates"}, {"date": "2026-11-20", "cat": "功能", "text": "實驗版新增帳號登入與雲端備份：實驗版多了「帳號與備份」：可用 Google 登入，把紀錄備份到自己的 Google 雲端硬碟（App 專用隱藏資料夾），換裝置用同一帳號登入即可還原；另備匯出／匯入 JSON，沒設定 Google 也能跨裝置搬紀錄。", "state": "完成", "src": "updates"}, {"date": "2026-11-19", "cat": "優化", "text": "更新總覽改版：紙感配色＋自製標誌：更新總覽換掉原本的深藍色，改成米白紙感底、墨黑字、深綠主色與 tes"}, {"date": "2026-11-18", "cat": "修正", "text": "鐵則：APK 下載包永遠跟著正式版同步；版本過舊視窗只在差距大時跳：（1）上線流程固定：任何正式版頁面或 App 異動，同一批提交先更新 APK、同步所有別名檔（～、～、～）、version.json 與下載頁，再做頁面。已腳本化（deploy.sh）。（2）App 端判定：安裝版本與線上差距 <10 個建置號且顯示版號相同 → 直接進更新動畫自動更新，不跳詢問視窗；差距 ≥10 或顯示版號整個換掉（例：→ ）→ 才跳「版本過舊」（確認更新／暫時不更新）。", "state": "已上線", "src": "updates"}, {"date": "2026-11-18", "cat": "優化", "text": "更新體驗：版本過舊詢問視窗＋更新動畫進度提示：（1）偵測到版本過舊先跳視窗，標題「版本過舊」，列出目前版本／最新版本／更新內容，兩顆按鈕「確認更新」「暫時不更新」；選暫時不更新會記住該版本 24 小時內不再跳出。（2）確認後顯示全螢幕更新動畫：旋轉圈＋進度條，下面文字依進度切換「正在抓取新的更新包」「更新中，請稍等」「即將完成，正在準備安裝」。（3）下載完成先驗證安裝包（能否解析、套件名稱是否相同、版本是否達標），不符就跳「更新包不相符」視窗，可重新下載或暫時不更新。", "state": "已上線", "src": "updates"}, {"date": "2026-11-18", "cat": "優化", "text": "更新流程改為 App 內動畫，不再外開網頁：移除舊版把使用者丟到 /apk/ 頁面的行為。開啟 App 自動檢查版本→顯示全螢幕更新動畫（旋轉圈＋百分比）→App 自己下載 APK→下載完成直接呼叫系統安裝器。全程不開瀏覽器、不跳任何網址。", "state": "已上線", "src": "updates"}, {"date": "2026-11-18", "cat": "優化", "text": "內置更新：App 自己下載並安裝新版，不再跳下載頁：已安裝 App 的使用者，開啟 App 或在每日 00:00 自動檢查到新版時，App 自行下載 APK（存到 App 專屬目錄）並直接呼叫系統安裝器，全程不需開瀏覽器、不需回下載頁。首次安裝仍走 /apk/ 或 /vn/ 下載頁。Android 8+ 首次使用需允許「安裝未知來源應用」。", "state": "已上線", "src": "updates"}, {"date": "2026-11-18", "cat": "新增", "text": "開機進首頁、站內不外跳、左緣右滑回首頁、每日 00:00 自動檢查更新：正式版 App 開機改為進入主選單（https://jcntea.github.io/worklog/），不再直接進正式版表單頁。所有站內頁面（首頁／正式版／開發版／優化版／實驗版／備用版／APK 頁）都在 App 內開啟，不再外跳瀏覽器。新增手勢：從螢幕左緣往右滑（左手大拇哥）即回到首頁。新增每日 00:00 自動檢查更新：有新版會發通知，點通知開下載頁。正式版 （versionCode 15）、後台版 Bn1.5（versionCode 6）。", "state": "已上線", "src": "updates"}, {"date": "2026-11-18", "cat": "優化", "text": "正式版 App 回主選單；每日 00:00 自動檢查更新：正式版 App 開機改為進入前台主選單（https://jcntea.github.io/worklog/），不再直接進正式版表單頁。另加入每日 00:00 自動版本檢查：時間到會在背景讀版本檔，若比手機上的版本新就發通知，點通知直接開下載頁；App 依然不下載、不安裝 APK。後台版 Bn1.4 同步支援。", "state": "已上線", "src": "updates"}, {"date": "2026-11-18", "cat": "優化", "text": "App 內開啟站內頁面，不再外跳瀏覽器：舊版把任何 http 連結都交給系統瀏覽器，所以在後台 App 裡點「開發版／優化版／實驗版／正式版／備用版」都會跳出 Chrome。已改成：只要是本站（jcntea.github.io/worklog）的頁面就留在 App 內開；只有真正的外部網站與 APK 下載才走瀏覽器。正式版 （versionCode 13）、後台版 Bn1.3（versionCode 4）。", "state": "已上線", "src": "updates"}, {"date": "2026-11-18", "cat": "修正", "text": "修正 Android 11+ 安裝失敗（resources.arsc 壓縮問題）：先前打包流程把 resources.arsc 壓成 DEFLATE，Android 11 以上（targetSdk 30+）會直接「剖析套件失敗」而無法安裝。已改用保留未壓縮（STORED）的打包方式重出：正式版 （versionCode 12）、後台版 Bn1.2（versionCode 3）。同時保留 // 三種簽章與 4-byte 對齊，舊紀錄可覆蓋升級。", "state": "已上線", "src": "updates"}, {"date": "2026-11-18", "cat": "修正", "text": "移除 APK 自行安裝行為，處理 Play 安全防護封鎖：兩支 App 都拿掉 android.permission.REQUEST_INSTALL_PACKAGES 與舊式 WRITE_EXTERNAL_STORAGE，也把「App 內下載後自動跳安裝」的流程改成用瀏覽器開啟下載頁；App 本身不再下載或安裝任何 APK。現在只剩 網際網路／網路狀態／定位／通知 四類權限。必須更新 App 才會生效：正式版 、後台版 Bn1.1。", "state": "已上線", "src": "updates"}, {"date": "2026-11-18", "cat": "新增", "text": "新增後台首頁 /vn/ 與後台專用 App（內測）：新增獨立後台首頁 https://jcntea.github.io/worklog/vn/（開發版 ／優化版 ／實驗版 集中入口，含密碼與本機記憶）。另出後台專用 APK worklog-apk（套件 com.jcmtea.worklog.vn、名稱「勤務日誌系統 後台」、開機直接進 /vn/），只放在後台首頁下載，前台首頁與 APK 頁都不露出。", "state": "已上線", "src": "updates"}, {"date": "2026-11-18", "cat": "優化", "text": "安卓 App 名稱改為「勤務日誌系統」：桌面／應用列表顯示名稱從 Work Log System x 改為中文「勤務日誌系統」（套件 com.jcmtea.worklog 不變、簽章不變，可直接覆蓋安裝）。同時保留 的修正：開機載入 GitHub Pages 正式版。", "state": "已上線", "src": "updates"}, {"date": "2026-11-18", "cat": "修正", "text": "APK 改載入 GitHub Pages 正式版（原為被封控的妙搭頁）：內建首頁仍是 4m6abptdukj9k.doubao.link/app/app_17j5rzde83b（已封控），所以裝了 App 打開是空白／被封。改為 https://jcntea.github.io/worklog/formal/，更新檢查改讀 github.io/assets/version.json；仍用同一把金鑰簽章，可直接覆蓋升級。", "state": "待安裝", "src": "updates"}, {"date": "2026-11-18", "cat": "新增", "text": "APK 上線可直接下載：新增 /apk/ 下載頁（版本、大小、安卓安裝步驟）＋ ASCII 檔名副本 assets/worklog-apk（下載檔名不帶空白）。首頁底部加「App 下載（安卓）」入口；實測下載 25,395 bytes、MIME application/vnd.android.package-archive。", "state": "已上線", "src": "updates"}, {"date": "2026-11-18", "cat": "優化", "text": "三頁移除重複首頁選單層：開發版／優化版／實驗版原本一進去都先跳出一個重複的首頁選單層（#homeScr），把密碼框與主畫面蓋住。三頁皆改預設隱藏：進去直接是本頁後台。", "state": "已上線", "src": "updates"}, {"date": "2026-11-18", "cat": "修正", "text": "站內連結復原：原本指向已封妙搭頁的 tinyurl（4m6abptdukj9k.doubao.link，全部 404）改回站內：優化版-後台→../opt/、開發版-後台→../dev/、回主頁→../index.html、教學→../guide/。四頁已無 tinyurl 殘留。", "state": "已上線", "src": "updates"}, {"date": "2026-11-18", "cat": "優化", "text": "更新彈窗可直接下載：開發版／優化版／實驗版的「App 有新版本」彈窗，按鈕從「知道了」改為「立即下載」，直接跳 /apk/ 下載頁（version.json 新增 apkPage 欄位）。", "state": "已上線", "src": "updates"}, {"date": "2026-11-17", "cat": "功能", "text": "新增左上三條槓與左側隱藏選單（正式版／開發版／優化版／教學網／找廁所）；出勤地點、尋找廁所、捷運站點資料庫、時段記錄、近期日誌五個白色標題改成可點擊收折（合計區不動）。", "src": "changelog"}, {"date": "2026-11-17", "cat": "修正", "text": "開發版內嵌首頁層造成異常：開發版一進去先跳出重複的首頁選單層（#homeScr），把密碼框整個蓋住，看起來像「打不開」。已改為預設隱藏：進入開發版直接看到後台，其他人點開會先要求輸入密碼。", "state": "已上線", "src": "updates"}, {"date": "2026-11-17", "cat": "新增", "text": "開發版右下角掛實驗版 入口：依「Vi 掛在 Vn 裡頭」規則，實驗版不再從首頁獨立進入，改由開發版介面右下角「實驗版 」小膠囊進入。", "state": "已上線", "src": "updates"}, {"date": "2026-11-17", "cat": "修正", "text": "開發版 3 條失效 short-link：原本 3 條 tinyurl 指向已封的妙搭頁面（優化版-後台 ×1、回主頁 ×2），已改為站內相對路徑 ../opt/ 與 ../index.html。", "state": "已上線", "src": "updates"}, {"date": "2026-11-17", "cat": "新增", "text": "實驗版座標修正上線：vi/index.html 已推上 GitHub Pages，線上版本與本機修正版一致（1,165,767 bytes）。", "state": "已上線", "src": "updates"}, {"date": "2026-11-17", "cat": "修正", "text": "座標離群自動排除：銀行／超市資料裡有座標被標到別的行政區（台北落點卻配到基隆門市）。已加自我校正：同行政區內離群 >6 km 的門市不列入「最近」，改由同區門市遞補。台北實測：超市 256 m／銀行 96 m／捷運出口 61 m。", "state": "已修正", "src": "updates"}, {"date": "2026-11-17", "cat": "新增", "text": "首頁改版（6 顆版）：新增「優化版 ・獨立版」入口；備用正式版移到正式版底下；找廁所改反灰未開放；開發版標註「・含實驗版 」；實驗版不再當獨立入口。", "state": "已上線", "src": "updates"}, {"date": "2026-11-17", "cat": "優化", "text": "實驗版自運行驗證：隨機 GPS（基隆／新北／台北各 3）＋最近店家（銀行／超市／捷運出口，9 家不重複）＋逐筆登記；寫入上午 排障 4／會同 5、合計 9 件。", "state": "已驗證", "src": "updates"}, {"date": "2026-11-17", "cat": "新增", "text": "自運營報告頁：/report/ 靜態頁：今日 9 筆明細、App 實際寫入結果、更新政策、資料品質提醒；不經平台審核。", "state": "已交付", "src": "updates"}, {"date": "2026-11-17", "cat": "新增", "text": "更新政策分級：重大＝要重裝或 App 必須升級才匹配，只在版本異常／更新包不匹配時提示；細碎＝全部寫進 updates.json，不提示，00:00–06:00 隨機生效。", "state": "已寫入", "src": "updates"}, {"date": "2026-11-17", "cat": "修正", "text": "銀行／超市座標校正：台北落點配到「全聯基隆暖暖 1.5 km」、新北配到「國泰汐止 10.3 km」「中信營業部 13.8 km」；BKEN／MKEN 座標表需校正，否則「抓最近」會拉去遠店。", "s   for(const it of items){
    const d = String(it.date||'').slice(0,10);
    const t = String(it.title||'').replace(/\s+/g,' ').trim();
    const det = String(it.detail||'').replace(/\s+/g,' ').trim();
    const text = (t + (det ? '：' + det : '')).trim();
    const key = text.replace(/[^\w\u4e00-\u9fff]/g,'').slice(0,80);
    if(!key || seen.has(key)) continue;
    seen.add(key);
    rows.push({date:d, cat:it.cat||'其他', text:text});
  }
  rows.sort((a,b)=> String(b.date).localeCompare(String(a.date)));
  DATA.rows = rows; DATA.total = rows.length;
  DATA.first = rows.length ? rows[rows.length-1].date : DATA.first;
  DATA.last = rows.length ? rows[0].date : DATA.last;
  DATA.cats = Array.from(new Set(rows.map(r=>r.cat))).sort();
  kpi(); chips(); render();
}
function loadLive(){
  const bar = document.getElementById('liveBar');
  fetch('../assets/updates.json?ts=' + Date.now(), {cache:'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      const items = (d && d.items) ? d.items : (Array.isArray(d) ? d : []);
      mergeLive(items);
      bar.className = 'live on';
      bar.textContent = '即時同步・' + new Date().toLocaleTimeString('zh-Hant',{hour12:false}) + '・' + DATA.total + ' 筆';
    })
    .catch(() => { bar.className = 'live'; bar.textContent = '離線快照'; });
}
document.getElementById('q').oninput = e => { kw = e.target.value.trim(); render(); };
kpi(); chips(); render(); loadLive(); setInterval(loadLive, 60000);
</script>
