<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>更新總覽・勤務記錄系統</title>
<style>
:root{--bg:#0B1220;--card:#141C2E;--line:#243049;--txt:#E8EDF6;--dim:#94A3BD;--acc:#3B82F6}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,#16233C,#0B1220 60%) fixed;color:var(--txt);
font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 56px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);text-decoration:none;font-size:13px;margin-bottom:14px}
h1{margin:0 0 6px;font-size:24px;letter-spacing:.02em}
.sub{color:var(--dim);font-size:13.5px;line-height:1.6;margin:0}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 14px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:19px;font-weight:700;margin-bottom:2px}
.kpi span{font-size:11.5px;color:var(--dim)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.q{flex:1 1 100%;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);
padding:10px 12px;font-size:14px;outline:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--txt);
border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.day{margin:20px 0 0}
.day-h{display:flex;align-items:center;gap:10px;margin:0 0 8px;color:var(--dim);font-size:12.5px;letter-spacing:.04em}
.day-h:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}
.item{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);
border-radius:10px;padding:11px 13px;margin-bottom:8px;font-size:14px;line-height:1.7;word-break:break-word}
.item .tag{display:inline-block;font-size:11px;color:#9FC1FF;background:#1B2A45;border-radius:6px;
padding:2px 7px;margin-right:6px;vertical-align:1px}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:14px}
.live{margin:10px 0 0;font-size:12px;color:var(--dim)}
.live.on{color:#7BCB9B}
.foot{margin-top:26px;color:var(--dim);font-size:12px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 回勤務系統</a>
  <h1>更新總覽</h1>
  <p class="sub">從最初到現在，所有改動集中在這一頁。只列內容，不標版本。</p>
  <div class="kpi">
    <div><b id="kTotal">0</b><span>累計更新</span></div>
    <div><b id="kFirst">—</b><span>最早紀錄</span></div>
    <div><b id="kLast">—</b><span>最近更新</span></div>
  </div>
  <div class="bar" id="chips"></div>
  <div class="bar"><input class="q" id="q" placeholder="搜尋關鍵字，例如 廁所、GPS、捷運、蝦皮" autocomplete="off"></div>
  <div id="list"></div>
  <div id="liveBar" class="live">連線中…</div>
  <div class="foot">資料來源：站台更新紀錄（含各版本頁內歷史）。同一天的多筆改動依原文順序陳列；已移除或已被取代的功能仍保留紀錄。</div>
</div>
