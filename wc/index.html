<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="format-detection" content="telephone=no">
<title>勤務記錄系統_找廁所 V0.3</title>
<meta name="description" content="全臺找廁所：公共廁所＋7-11／全家有廁所門市＋捷運站，依目前位置由近到遠列出，支援無障礙、尿布台與一鍵導航。">
<style>
:root{
  --bg:#0B1220;--card:#16223A;--card2:#101B2E;--line:#24344F;
  --ink:#F5F7FB;--ink2:#A9B8CE;--ink3:#7E90AA;--blue:#2E5C9E;--blue2:#3B72C0;
  --green:#1C5D3A;--gold:#6B4E13;--red:#5A2231;--fmb:#1B4B7A;--mrt:#3E2C6B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI","PingFang TC",sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
body{min-height:100dvh;background:radial-gradient(120% 55% at 50% -8%,#152340 0%,rgba(11,18,32,0) 62%),var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
a{color:inherit}
.brand{display:flex;align-items:center;gap:8px;font:600 11px/1.4 ui-monospace,monospace;letter-spacing:.16em;color:var(--ink3)}
.brand i{width:6px;height:6px;border-radius:50%;background:#4C7BD9;display:block}
h1{font-size:25px;line-height:1.28;margin:10px 0 6px;font-weight:800;letter-spacing:-.01em}
h1 span{font:600 12px/1 ui-monospace,monospace;color:var(--ink3);margin-left:8px;vertical-align:middle}
.sub{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.65}
.acts{display:flex;gap:8px;margin:14px 0 12px}
button{font-family:inherit}
.act{flex:1;padding:13px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.act:active{transform:scale(.985)}
.act.primary{background:linear-gradient(180deg,#3B72C0,#2E5C9E);border-color:#3B72C0}
.act svg{width:16px;height:16px;flex:0 0 16px}
.status{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:rgba(22,34,58,.55);font-size:12px;line-height:1.55;color:var(--ink2);
  display:flex;gap:8px;align-items:flex-start}
.status .dot{width:7px;height:7px;border-radius:50%;background:#4C7BD9;margin-top:4px;flex:0 0 7px}
.status.warn .dot{background:#D9A63C}
.status.err .dot{background:#D9615E}
.status b{color:var(--ink);font-weight:700}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px 6px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--ink2);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.searchbox{position:relative;margin:0 0 12px}
.searchbox input{width:100%;padding:12px 38px;border-radius:12px;border:1px solid var(--line);
  background:var(--card2);color:var(--ink);font-size:14px;outline:none;appearance:none;font-family:inherit}
.searchbox input::placeholder{color:#6E8099}
.searchbox input:focus{border-color:#3B72C0}
.searchbox .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;opacity:.55}
.searchbox .clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;background:transparent;
  color:#7E90AA;font-size:16px;line-height:1;display:none;cursor:pointer}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px;font-size:11.5px;color:var(--ink3)}
.meta select{background:var(--card2);border:1px solid var(--line);color:var(--ink2);border-radius:8px;
  padding:6px 8px;font-size:11.5px;font-family:inherit;max-width:52vw}
.list{display:flex;flex-direction:column;gap:10px}
.item{padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--card);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.item .top{display:flex;align-items:flex-start;gap:8px}
.name{font-weight:700;font-size:15px;line-height:1.4;word-break:break-word}
.dist{margin-left:auto;flex:0 0 auto;font:700 12px/1.2 ui-monospace,monospace;color:#9FB6D8;text-align:right;white-space:nowrap}
.dist small{display:block;font-weight:500;font-size:10px;color:var(--ink3);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;background:#1E3A6B;color:#CFE0FF;white-space:nowrap}
.tag.acc{background:#243A61;color:#C6D8FF}
.tag.fam{background:var(--green);color:#CFF6DF}
.tag.g-old{background:#28354B;color:#B7C4D6}
.tag.g-best{background:var(--gold);color:#FFE7B5}
.tag.g-bad{background:var(--red);color:#FFD7E2}
.tag.cat{background:#26324A;color:#AFC0D8}
.tag.b711{background:#1C5D3A;color:#D6F7E4}
.tag.bfm{background:var(--fmb);color:#D3E9FF}
.tag.bmrt{background:var(--mrt);color:#DCD3FF}
.addr{margin-top:8px;font-size:12px;color:var(--ink2);line-height:1.55;word-break:break-word}
.mine{margin-top:6px;font-size:11px;color:var(--ink3);word-break:break-word}
.bottom{display:flex;gap:8px;margin-top:11px;align-items:center}
.nav{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;
  padding:10px;border-radius:10px;border:1px solid #33507D;background:linear-gradient(180deg,#2C4A7C,#243C63);
  color:#EAF1FF;font-size:13px;font-weight:700}
.nav:active{transform:scale(.985)}
.nav svg{width:14px;height:14px}
.copy{flex:0 0 auto;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
  color:var(--ink2);font-size:12.5px;cursor:pointer}
.empty{padding:26px 16px;text-align:center;border:1px dashed var(--line);border-radius:13px;color:var(--ink2);font-size:13px;line-height:1.7}
.more{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
  color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.8;color:var(--ink3)}
.foot a{color:#93B0DB;text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:#1B2942;border:1px solid var(--line);color:var(--ink);font-size:12.5px;padding:10px 16px;border-radius:10px;
  opacity:0;pointer-events:none;transition:.22s;z-index:20;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.skel{height:78px;border-radius:13px;border:1px solid var(--line);background:linear-gradient(90deg,#15223A 25%,#1B2A45 37%,#15223A 63%);background-size:400% 100%;animation:sk 1.3s infinite}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><i></i>勤務記錄系統 · TOILET FINDER</div>
  <h1>找廁所<span>V0.3</span></h1>
  <p class="sub">公共廁所 ＋ 7-11／全家「有廁所」門市 ＋ 捷運站，依目前位置由近到遠排序，可直接導航。</p>

  <div class="acts">
    <button class="act primary" id="btnGps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      取得目前位置
    </button>
    <button class="act" id="btnRe">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 6.4"/><path d="M20 4v7h-7"/></svg>
      重新整理
    </button>
  </div>

  <div class="status" id="status"><span class="dot"></span><div id="statusText">尚未定位。按下「取得目前位置」後會載入附近廁所與門市資料。</div></div>

  <div class="filters" id="chips">
    <button class="chip on" data-f="all">全部</button>
    <button class="chip" data-f="s711">7-11</button>
    <button class="chip" data-f="sfm">全家</button>
    <button class="chip" data-f="mrt">捷運站</button>
    <button class="chip" data-f="acc">無障礙</button>
    <button class="chip" data-f="baby">尿布台</button>
    <button class="chip" data-f="traffic">交通</button>
    <button class="chip" data-f="park">公園</button>
    <button class="chip" data-f="shop">商場</button>
    <button class="chip" data-f="scenic">觀光</button>
    <button class="chip" data-f="public">洽公</button>
  </div>

  <div class="searchbox">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#8FA3C0" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="search" placeholder="搜尋廁所／門市名稱或地址" autocomplete="off">
    <button class="clr" id="qClr" aria-label="清除">✕</button>
  </div>

  <div class="meta">
    <select id="county"><option value="">選擇縣市（未定位時可用）</option></select>
    <span id="metaInfo">—</span>
  </div>

  <div class="list" id="list"></div>
  <button class="more" id="btnMore" hidden>載入更多</button>

  <div class="foot">
    資料來源：<a href="https://toilets.littlechin.tw/map" target="_blank" rel="noopener">littlechin.tw 廁所地圖</a>（政府開放資料彙整，共 <span id="totalAll">—</span> 筆）、
    <a href="https://emap.pcsc.com.tw/#" target="_blank" rel="noopener">7-ELEVEN 門市地圖</a>（有廁所門市 <span id="n711">—</span> 家）、
    <a href="https://www.family.com.tw/Marketing/zh/Map" target="_blank" rel="noopener">全家店舖查詢</a>（有廁所門市 <span id="nfm">—</span> 家）。
    捷運站廁所取自公廁資料中名稱含「捷運」者。<br>
    門市資料抓取日 <span id="storeDate">—</span>；導航使用 Google 地圖，現場設施請以店家公告為準。
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var IDX_URL = "https://toilets.littlechin.tw/data/index.json";
var C_URL   = "https://toilets.littlechin.tw/data/counties/";
var STORE_URL = "data/stores.json";
var CACHE_MS = 6*60*60*1000;
var PAGE = 20;
var NEAR_STORE_KM = 60;      // 定位時只納入 60 公里內的門市，避免一次列出全臺

var state = { idx:null, counties:[], venues:[], pos:null,
  filter:"all", q:"", shown:PAGE, busy:false, countySel:"",
  stores:null, storesMeta:null };

var $ = function(id){ return document.getElementById(id); };
var listEl=$("list"), statusEl=$("status"), statusTx=$("statusText");

function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t.__h); t.__h=setTimeout(function(){ t.classList.remove("on"); },1900);
}
function setStatus(txt, kind){
  statusEl.className="status"+(kind?" "+kind:"");
  statusTx.innerHTML=txt;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

function cacheGet(k){
  try{ var r=localStorage.getItem("wc_"+k); if(!r) return null;
    var o=JSON.parse(r); if(!o||!o.t||Date.now()-o.t>CACHE_MS) return null; return o.v;
  }catch(e){ return null; }
}
function cacheSet(k,v){
  try{ localStorage.setItem("wc_"+k, JSON.stringify({t:Date.now(),v:v})); }catch(e){}
}

function hav(a,b,c,d){
  var R=6371000, r=Math.PI/180;
  var dLat=(c-a)*r, dLng=(d-b)*r;
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function bboxDist(b,lat,lng){
  var la=Math.max(b.minLat,Math.min(b.maxLat,lat));
  var ln=Math.max(b.minLng,Math.min(b.maxLng,lng));
  return hav(lat,lng,la,ln);
}
function fmtDist(m){ return m<1000 ? Math.round(m)+" m" : (m/1000).toFixed(m<10000?1:0)+" km"; }
function normT(s){ return String(s||"").replace(/臺/g,"台"); }

function loadIndex(){
  var c=cacheGet("index"); if(c){ state.idx=c; return Promise.resolve(c); }
  return fetch(IDX_URL).then(function(r){
    if(!r.ok) throw new Error("index "+r.status); return r.json();
  }).then(function(j){ state.idx=j; cacheSet("index",j); return j; });
}
function loadCounty(file){
  var c=cacheGet("c_"+file); if(c) return Promise.resolve(c);
  return fetch(C_URL+file).then(function(r){
    if(!r.ok) throw new Error(file+" "+r.status); return r.json();
  }).then(function(j){ try{ cacheSet("c_"+file,j); }catch(e){} return j; });
}
function loadStores(){
  if(state.stores) return Promise.resolve(state.stores);
  var c=cacheGet("stores");
  if(c && c.s){ state.stores=storeVenues(c); state.storesMeta=c; return Promise.resolve(state.stores); }
  return fetch(STORE_URL).then(function(r){
    if(!r.ok) throw new Error("stores "+r.status); return r.json();
  }).then(function(j){
    state.storesMeta=j; state.stores=storeVenues(j);
    try{ cacheSet("stores",j); }catch(e){}
    return state.stores;
  });
}
function storeVenues(j){
  var out=[], rows=(j&&j.s)||[];
  for(var i=0;i<rows.length;i++){
    var r=rows[i], lat=+r[3], lng=+r[4];
    if(!isFinite(lat)||!isFinite(lng)) continue;
    out.push({ name:String(r[1]||""), addr:String(r[2]||""), area:"",
      lat:lat, lng:lng, cat:"便利商店", mine:"", types:{}, diaper:false, g:-1, gzh:"",
      src:(Number(r[0])===0?"711":"fm"), mrt:false });
  }
  return out;
}

var SUF=/(?:[-－—｜|_]\s*)?(無障礙廁所|親子廁所|性別友善廁所|混合廁所|男廁所|女廁所|男廁|女廁|無障礙|親子|友善|混合|男|女|廁所)\s*$/;
function baseName(n){
  var b=String(n||"")
    .replace(/（[^）]*）|\([^)]*\)|【[^】]*】/g,"")   // 去掉 (Y13)、（B2）等註記，避免同一處被拆成多筆
    .trim();
  for(var i=0;i<3;i++){ b=b.replace(SUF,"").replace(/[-－—｜|_]\s*$/,"").trim(); }
  return b||String(n||"公共廁所").trim();
}
function gradeRank(g){
  if(g==="excellent"||g==="特優級") return 3;
  if(g==="good"||g==="優級") return 2;
  if(g==="normal"||g==="普通級"||g==="合格") return 1;
  return 0;
}
function toVenues(arr){
  var map={}, out=[];
  for(var i=0;i<arr.length;i++){
    var t=arr[i], lat=+t.latitude, lng=+t.longitude;
    if(!isFinite(lat)||!isFinite(lng)) continue;
    var bn=baseName(t.name_zh);
    // 同地址（約 1 公里網格）視為同一處：男廁／女廁／無障礙／不同樓層合併成一張卡
    var key=t.address_zh
      ? String(t.address_zh)+"|"+lat.toFixed(2)+","+lng.toFixed(2)
      : bn+"|"+lat.toFixed(4)+","+lng.toFixed(4);
    var v=map[key];
    if(!v){
      v=map[key]={ name:bn, addr:t.address_zh||"", area:t.area_zh||"",
        lat:lat, lng:lng, cat:t.category_zh||"", mine:t.manager||t.administration||"",
        types:{}, diaper:false, g:0, gzh:"", src:"wc", mrt:false };
      out.push(v);
    }
    if(/捷運/.test(String(t.name_zh||""))||/捷運站/.test(String(t.address_zh||""))) v.mrt=true;
    if(t.type_zh) v.types[t.type_zh]=1;
    if(t.has_diaper===true) v.diaper=true;
    if(bn && bn.length < v.name.length) v.name=bn;   // 取較簡潔的名稱
    var gr=gradeRank(t.grade);
    if(gr>=v.g){ v.g=gr; v.gzh=t.grade_zh||""; }
    if(!v.addr && t.address_zh) v.addr=t.address_zh;
  }
  return out;
}

var CATMAP = {
  "traffic":"交通", "park":"公園", "shop":"商業營業場所",
  "scenic":"觀光地區及風景區", "public":"民眾洽公場所"
};
function matches(v){
  var f=state.filter;
  if(f==="s711" && v.src!=="711") return false;
  if(f==="sfm" && v.src!=="fm") return false;
  if(f==="mrt" && !v.mrt) return false;
  if(f==="acc" && !v.types["無障礙廁所"]) return false;
  if(f==="baby" && !(v.diaper || v.types["親子廁所"])) return false;
  if(CATMAP[f]){
    if(v.src!=="wc") return false;
    if(String(v.cat).indexOf(CATMAP[f])<0) return false;
  }
  if(state.q){
    var q=state.q.toLowerCase();
    if((v.name+" "+v.addr+" "+v.area+" "+v.mine).toLowerCase().indexOf(q)<0) return false;
  }
  return true;
}
function tagHtml(v){
  var h="";
  if(v.src==="711") h+='<span class="tag b711">7-11</span>';
  if(v.src==="fm")  h+='<span class="tag bfm">全家</span>';
  if(v.mrt) h+='<span class="tag bmrt">捷運站</span>';
  if(v.g===2) h+='<span class="tag g-old">優級</span>';
  else if(v.g===1) h+='<span class="tag g-old">普通級</span>';
  else if(v.g===0 && v.src==="wc") h+='<span class="tag g-bad">待改善</span>';
  if(v.types["無障礙廁所"]) h+='<span class="tag acc">無障礙</span>';
  if(v.types["親子廁所"]||v.diaper){
    var lbl = v.types["親子廁所"] ? (v.diaper?"親子・尿布台":"親子") : "尿布台";
    h+='<span class="tag fam">'+lbl+'</span>';
  }
  if(v.types["性別友善廁所"]) h+='<span class="tag cat">性別友善</span>';
  if(v.cat && v.src==="wc") h+='<span class="tag cat">'+esc(v.cat)+'</span>';
  return h;
}
function render(){
  var src = state.venues;
  if(state.pos){
    var lat=state.pos.lat, lng=state.pos.lng;
    src = src.slice().sort(function(a,b){
      return hav(lat,lng,a.lat,a.lng)-hav(lat,lng,b.lat,b.lng);
    });
  } else {
    src = src.slice().sort(function(a,b){ return a.name.localeCompare(b.name,"zh-Hant"); });
  }
  var hit=[];
  for(var i=0;i<src.length;i++){ if(matches(src[i])) hit.push(src[i]); }
  var showArr = hit.slice(0,state.shown);

  $("metaInfo").textContent = hit.length ? (hit.length+" 間 · 顯示 "+showArr.length) : "無符合結果";

  if(!hit.length){
    listEl.innerHTML = '<div class="empty">'+(src.length?"沒有符合條件的廁所，換個篩選或關鍵字試試。":
      (state.busy?"正在載入資料…":(state.pos?"附近沒有資料，可改選其他縣市。":"按『取得目前位置』，或先選擇縣市。")))+'</div>';
    $("btnMore").hidden = true;
    return;
  }

  var html="", shown=0;
  for(var k=0;k<showArr.length;k++){
    var v=showArr[k];
    shown++;
    var d = state.pos ? fmtDist(hav(state.pos.lat,state.pos.lng,v.lat,v.lng)) : "";
    html+='<div class="item">'
      +'<div class="top"><div class="name">'+esc(v.name)+'</div>'
      +(state.pos?'<div class="dist">'+d+'<small>直線距離</small></div>':'')
      +'</div>'
      +'<div class="tags">'+tagHtml(v)+'</div>'
      +'<div class="addr">'+esc(v.addr||"（無地址）")+'</div>'
      +(v.mine?'<div class="mine">管理：'+esc(v.mine)+'</div>':'')
      +'<div class="bottom">'
        +'<a class="nav" href="https://www.google.com/maps/dir/?api=1&destination='+v.lat.toFixed(6)+','+v.lng.toFixed(6)+'&travelmode=walking" target="_blank" rel="noopener">'
          +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>導航</a>'
        +'<button class="copy" data-addr="'+esc(v.addr)+'" data-lat="'+v.lat.toFixed(6)+'" data-lng="'+v.lng.toFixed(6)+'">複製地址</button>'
      +'</div></div>';
  }
  if(!shown){
    listEl.innerHTML='<div class="empty">沒有符合條件的廁所，換個篩選或關鍵字試試。</div>';
  } else {
    listEl.innerHTML=html;
  }
  $("btnMore").hidden = showArr.length>=hit.length;
  $("btnMore").textContent = "載入更多（已 "+shown+"／共 "+hit.length+" 間）";
}

function skeleton(n){
  var h=""; for(var i=0;i<n;i++) h+='<div class="skel"></div>'; listEl.innerHTML=h;
}

function rankedCounties(lat,lng){
  return state.idx.counties.map(function(c){ return {c:c, d:bboxDist(c.bounds,lat,lng)}; })
    .sort(function(a,b){ return a.d-b.d; });
}

function storesNear(lat,lng){
  var arr=state.stores||[], out=[];
  for(var i=0;i<arr.length;i++){ if(hav(lat,lng,arr[i].lat,arr[i].lng)<=NEAR_STORE_KM*1000) out.push(arr[i]); }
  return out;
}
function storesInCounty(name){
  var arr=state.stores||[], n=normT(name), out=[];
  for(var i=0;i<arr.length;i++){
    var a=normT(arr[i].addr);
    if(a.indexOf(n)===0) out.push(arr[i]);
  }
  return out;
}

function loadNearby(lat,lng){
  var ranked=rankedCounties(lat,lng), picked=[];
  for(var i=0;i<ranked.length && picked.length<2;i++){
    if(picked.length===0 || ranked[i].d<=25000) picked.push(ranked[i]);
  }
  state.venues=[]; state.busy=true;
  var names=picked.map(function(p){ return p.c.name_zh; }).join("、");
  setStatus("已定位 · 正在載入 <b>"+esc(names)+"</b> 的廁所與門市資料…");
  skeleton(4);

  var chain=picked.reduce(function(prev,cur){
    return prev.then(function(){
      return loadCounty(cur.c.filename).then(function(arr){
        state.venues=state.venues.concat(toVenues(arr));
        render();
      });
    });
  }, Promise.resolve());

  return chain.then(function(){
    return loadStores().then(function(){ return storesNear(lat,lng); }).catch(function(){ return []; })
      .then(function(sv){
        state.venues=state.venues.concat(sv);
        state.busy=false;
        var sc=sv.length ? "，含 7-11／全家 "+sv.length+" 家" : "";
        setStatus("已載入 <b>"+esc(names)+"</b> · 合計 "+state.venues.length+" 處"+sc+"，依距離由近到遠");
        render();
      });
  });
}

function pickupCounty(file,name){
  state.pos=null; state.q=""; $("q").value=""; $("qClr").style.display="none";
  setStatus("載入 <b>"+esc(name)+"</b> 的廁所與門市資料…");
  skeleton(4); state.busy=true; state.shown=PAGE;
  return Promise.all([ loadCounty(file), loadStores().catch(function(){ return []; }) ])
  .then(function(res){
    var sv=storesInCounty(name);
    state.venues=toVenues(res[0]).concat(sv); state.busy=false;
    var sc=sv.length ? "，含 7-11／全家 "+sv.length+" 家" : "";
    setStatus("已載入 <b>"+esc(name)+"</b> · 共 "+state.venues.length+" 處"+sc+"，依名稱排序");
    render();
  }).catch(function(e){
    state.busy=false; listEl.innerHTML="";
    setStatus("資料載入失敗（"+esc(e.message||e)+"）。請稍後重試，或開啟 <a href='https://toilets.littlechin.tw/map' target='_blank' rel='noopener'>來源地圖</a>。","err");
  });
}

function getPos(){
  if(!navigator.geolocation){ setStatus("此瀏覽器不支援定位，請直接選擇縣市。","warn"); return; }
  state.busy=true;
  setStatus("正在取得目前位置…（若跳出權限視窗請按允許）");
  navigator.geolocation.getCurrentPosition(function(p){
    state.pos={lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy||0)};
    state.shown=PAGE; state.countySel=""; $("county").value="";
    setStatus("已定位（精度約 "+state.pos.acc+" 公尺）· 比對最近縣市…");
    boot().then(function(){ return loadNearby(state.pos.lat,state.pos.lng); })
      .catch(function(e){
        state.busy=false;
        setStatus("資料載入失敗（"+esc(e.message||e)+"）。可稍後重試，或到 <a href='https://toilets.littlechin.tw/map' target='_blank' rel='noopener'>來源地圖</a> 查詢。","err");
      });
  }, function(err){
    state.busy=false;
    var m = err.code===1 ? "定位權限被拒絕。請在瀏覽器設定允許定位，或直接選擇縣市。"
          : err.code===2 ? "目前無法取得位置（訊號不佳或系統定位關閉）。可改選縣市。"
          : "定位逾時，請再按一次或改選縣市。";
    setStatus(m,"warn");
  }, {enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}

function boot(){
  if(state.idx) return Promise.resolve();
  return loadIndex().then(function(j){
    var sel=$("county");
    sel.innerHTML='<option value="">選擇縣市（未定位時可用）</option>';
    var sorted=j.counties.slice().sort(function(a,b){ return b.count-a.count; });
    for(var i=0;i<sorted.length;i++){
      var o=document.createElement("option");
      o.value=sorted[i].filename+"|"+sorted[i].name_zh;
      o.textContent=sorted[i].name_zh+"（"+sorted[i].count.toLocaleString("en-US")+"）";
      sel.appendChild(o);
    }
    var d=new Date(j.last_updated);
    var ymd=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
    $("totalAll").textContent=j.total_count.toLocaleString("en-US")+" 筆，更新 "+ymd;
  });
}

(function metaStores(){
  fetch(STORE_URL).then(function(r){ return r.ok?r.json():null; }).then(function(j){
    if(!j) return;
    var n711=0,nfm=0;
    for(var i=0;i<j.s.length;i++){ if(+j.s[i][0]===0) n711++; else nfm++; }
    $("n711").textContent = n711.toLocaleString("en-US");
    $("nfm").textContent  = nfm.toLocaleString("en-US");
    $("storeDate").textContent = j.u||"—";
  }).catch(function(){});
})();

$("btnGps").addEventListener("click", function(){ getPos(); });
$("btnRe").addEventListener("click", function(){
  if(state.pos){
    state.shown=PAGE; setStatus("重新整理中…");
    loadNearby(state.pos.lat,state.pos.lng).catch(function(e){
      state.busy=false; setStatus("重新整理失敗（"+esc(e.message||e)+"）","err"); });
  } else if(state.countySel){
    var p=state.countySel.split("|"); pickupCounty(p[0],p[1]);
  } else toast("請先取得位置或選擇縣市");
});
$("chips").addEventListener("click", function(e){
  var b=e.target.closest(".chip"); if(!b) return;
  [].forEach.call($("chips").querySelectorAll(".chip"), function(c){ c.classList.toggle("on", c===b); });
  state.filter=b.getAttribute("data-f"); state.shown=PAGE; render();
});
$("q").addEventListener("input", function(e){
  state.q=e.target.value.trim(); state.shown=PAGE;
  $("qClr").style.display = state.q ? "block" : "none";
  render();
});
$("qClr").addEventListener("click", function(){
  $("q").value=""; state.q=""; $("qClr").style.display="none"; state.shown=PAGE; render(); $("q").blur();
});
$("county").addEventListener("change", function(e){
  state.countySel=e.target.value;
  if(!state.countySel) return;
  var p=state.countySel.split("|");
  boot().then(function(){ return pickupCounty(p[0],p[1]); });
});
$("btnMore").addEventListener("click", function(){ state.shown+=PAGE; render(); });
listEl.addEventListener("click", function(e){
  var b=e.target.closest(".copy"); if(!b) return;
  var txt=b.getAttribute("data-addr")||(b.getAttribute("data-lat")+","+b.getAttribute("data-lng"));
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast("已複製地址"); }, function(){ toast(txt); });
  } else toast(txt);
});

boot().catch(function(e){
  setStatus("無法連上資料來源（"+esc(e.message||e)+"）。可稍後重試，或到 <a href='https://toilets.littlechin.tw/map' target='_blank' rel='noopener'>來源地圖</a> 查詢。","err");
});
})();
</script>
