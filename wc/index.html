<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>勤務記錄系統_找廁所 V0.1</title>
<style>
:root{--bg:#0B1220;--card:#16223A;--line:#24344F;--ink:#F5F7FB;--ink2:#A9B8CE;--blue:#2E5C9E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.brand{font:600 12px/1.4 ui-monospace,monospace;letter-spacing:.14em;color:#7E90AA}
h1{font-size:26px;line-height:1.25;margin:8px 0 6px;font-weight:800}
.sub{font-size:13px;color:var(--ink2);line-height:1.6}
.bar{display:flex;gap:8px;margin:16px 0 10px}
button.act{flex:1;padding:13px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:600}
button.act.primary{background:var(--blue);border-color:#3B72C0}
.gps{margin:0 0 12px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;font-size:12px;color:var(--ink2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink2);font-size:13px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.list{display:flex;flex-direction:column;gap:10px}
.item{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.row{display:flex;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:#1E3A6B;color:#CFE0FF;white-space:nowrap}
.tag.fam{background:#1C5D3A;color:#CFF6DF}
.tag.hl{background:#5A2231;color:#FFD7E2}
.name{font-weight:700;font-size:15px}
.dist{margin-left:auto;font:600 12px/1 ui-monospace,monospace;color:#8FA3C0}
.addr{margin-top:6px;font-size:12px;color:var(--ink2);line-height:1.5}
.none{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--ink2);font-size:13px;line-height:1.7}
.note{margin-top:18px;font-size:12px;color:#7E90AA;line-height:1.7}
</style>
</head>

<div class="wrap">

</div>

var CUR = { lat:null, lng:null, acc:null };
var BRAND = "";
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function hav(a,b,c,d){ var R=6371000, p=Math.PI/180; var d1=(c-a)*p, d2=(d-b)*p; var x=Math.sin(d1/2)*Math.sin(d1/2)+Math.cos(a*p)*Math.cos(c*p)*Math.sin(d2/2)*Math.sin(d2/2); return 2*R*Math.asin(Math.min(1,Math.sqrt(x))); }
function dist(d){ return d<1000 ? Math.round(d)+" m" : (d/1000).toFixed(1)+" km"; }
function render(){
  var box = document.getElementById("list");
  if (CUR.lat == null){ box.innerHTML = '<div class="none">按「取得 GPS 位置」，就會依距離列出最近的便利商店。</div>'; return; }
  var arr=[], i, x;
  for (i=0;i<PSEN.length;i++){ x=PSEN[i]; if (BRAND && x[0]!==BRAND) continue; if (x[3]==null||x[4]==null) continue; arr.push({x:x,d:hav(CUR.lat,CUR.lng,x[3],x[4])}); }
  arr.sort(function(a,b){return a.d-b.d;});
  if (!arr.length){ box.innerHTML='<div class="none">這個範圍沒有符合的門市。</div>'; return; }
  box.innerHTML = arr.slice(0,15).map(function(t){
    var it=t.x, cls = it[0]==="全家" ? "tag fam" : (it[0]==="萊爾富" ? "tag hl" : "tag");
    return '<div class="item"><div class="row"><span class="'+cls+'">'+esc(it[0])+'</span><span class="name">'+esc(it[1])+'</span><span class="dist">'+dist(t.d)+'</span></div><div class="addr">'+esc(it[2]||"")+'</div></div>';
  }).join("");
}
function setGps(lat,lng,acc){
  CUR={lat:lat,lng:lng,acc:acc};
  document.getElementById("gpsBox").textContent = lat.toFixed(5)+", "+lng.toFixed(5)+(acc?" ・ ±"+Math.round(acc)+" m":"")+" ・ 最近 15 間";
  render();
}
document.getElementById("btnGps").addEventListener("click", function(){
  var box=document.getElementById("gpsBox");

  box.textContent="定位中…";
  navigator.geolocation.getCurrentPosition(function(p){ setGps(p.coords.latitude,p.coords.longitude,p.coords.accuracy); },

});
