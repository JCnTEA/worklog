<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>勤務記錄系統_首頁（選單）V0.10</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#0B1220;-webkit-text-size-adjust:100%}
</style>
<style>
#homeScr{position:fixed;inset:0;z-index:10080;background:linear-gradient(180deg,#0B1220,#111B2E 45%,#0B1220);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 34px) 18px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto;-webkit-overflow-scrolling:touch}
#homeScr .hs-brand{font:700 13px/1.4 "IBM Plex Mono",monospace;letter-spacing:.22em;color:#7C8AA5;text-transform:uppercase}
#homeScr .hs-title{font:900 30px/1.25 "Noto Sans TC",sans-serif;color:#F5F7FB;margin:10px 0 4px;letter-spacing:.02em}
#homeScr .hs-sub{font:400 14px/1.6 "Noto Sans TC",sans-serif;color:#93A1B8;margin-bottom:22px}
#homeScr .hs-grid{display:grid;grid-template-columns:1fr;gap:10px}
#homeScr .hs-tile{display:flex;flex-direction:row;align-items:center;justify-content:space-between;min-height:70px;padding:14px 16px;gap:10px;border-radius:14px;background:#16223A;border:1px solid #24344F;text-decoration:none;color:#F5F7FB}
#homeScr .hs-tile.main{background:linear-gradient(135deg,#1E3A6B,#16223A);border-color:#2E4C82;min-height:112px}
#homeScr .hs-tile .hs-name{font:700 18px/1.3 "Noto Sans TC",sans-serif}
#homeScr .hs-tile .hs-meta{font:500 12px/1.4 "IBM Plex Mono",monospace;color:#8FA3C0;margin:0;text-align:right;white-space:nowrap}
#homeScr .hs-tile.main .hs-name{font-size:22px}
#homeScr .hs-tile.off{background:#121A28;border-color:#1F2A3C;opacity:.55;cursor:not-allowed}
#homeScr .hs-tile.off .hs-name{color:#7C8AA5}
#homeScr .hs-tile.off .hs-meta{color:#66738A}
#homeScr .hs-foot{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:10px}
#homeScr .hs-note{font:400 12px/1.6 "Noto Sans TC",sans-serif;color:#7C8AA5;text-align:center}
</style>
<section id="homeScr">
  <div class="hs-brand">WORK LOG SYSTEM · HOME</div>
  <div class="hs-title">勤務記錄系統_首頁 V0.10</div>
  <div class="hs-sub">排障與會同件數記錄。先選入口，按「正式版」才進去登記；Android 版按按鈕下載安裝檔。</div>
  <div class="hs-grid">
    <a class="hs-tile" href="./guide/"><div class="hs-name">教學</div><div class="hs-meta">V0.10</div></a>
    <a class="hs-tile main" href="./formal/">
      <div class="hs-name">正式版</div>
      <div class="hs-meta">V0.10 · 平常上班用這個</div>
    </a>
    <a class="hs-tile" href="./backup/"><div class="hs-name">備用正式版</div><div class="hs-meta">V0.10 · 正式版打不開時用</div></a>
    <a class="hs-tile" href="./apk/"><div class="hs-name">Android 版</div><div class="hs-meta">V1.0 · 下載 APK</div></a>
    <div class="hs-tile off" aria-disabled="true"><div class="hs-name">優化版</div><div class="hs-meta">未開放</div></div>
    <div class="hs-tile off" aria-disabled="true"><div class="hs-name">開發版</div><div class="hs-meta">未開放</div></div>
    <div class="hs-tile off" aria-disabled="true"><div class="hs-name">找廁所</div><div class="hs-meta">未開放</div></div>
  </div>
  <div class="hs-foot">
    <div class="hs-note">按上面的按鈕選入口；正式版是平常上班用的那一頁。</div>
  </div>
</section>
<script>
/* 開頁自檢：偵測到新版就自動重載一次，不需重新下載或更換 App */
(function(){
  try{
    var K="wl_page_build";
    fetch("/worklog/assets/pages-version.json?t="+Date.now(),{cache:"no-store"})
      .then(function(r){return r.json();})
      .then(function(j){
        var b=String(j.build||""); if(!b) return;
        var old=null;
        try{ old=localStorage.getItem(K); }catch(e){}
        try{ localStorage.setItem(K,b); }catch(e){}
        if(old && old!==b){
          var base=location.pathname.replace(/index\.html$/,"");
          location.replace(base+"?upd="+encodeURIComponent(b));
        }
      })
      .catch(function(){});
  }catch(e){}
})();
</script>
</body>
</html>
