#homeScr{position:fixed;inset:0;z-index:10080;background:var(--wbg,linear-gradient(180deg,#0B1220,#111B2E 45%,#0B1220));background-size:cover;background-position:center;background-repeat:no-repeat;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 34px) 18px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto;-webkit-overflow-scrolling:touch}

<script>
/* 主題：7 色漸層＋相片（與後台、正式版主頁同一套設定） */
(function(){
  var TH=[
    {n:"紅橙黃",g:"linear-gradient(165deg,#F01152 0%,#FF5A1F 45%,#FFC83D 100%)"},
    {n:"紫粉桃",g:"linear-gradient(170deg,#A64CFF 0%,#FF79C9 55%,#FF0F87 100%)"},
    {n:"藍紫桃",g:"linear-gradient(170deg,#1FA8F0 0%,#7B4CFF 55%,#FF2FA0 100%)"},
    {n:"青綠黃",g:"linear-gradient(170deg,#00C2E0 0%,#12D6A0 40%,#FFC233 100%)",light:1},
    {n:"彩紅",g:"linear-gradient(160deg,#5BE36B 0%,#00C9E0 25%,#FF2FA0 55%,#FFC83D 78%,#FF5A1F 100%)"},
    {n:"黑",g:"linear-gradient(160deg,#000000 0%,#10141B 55%,#1C222B 100%)"},
    {n:"白",g:"linear-gradient(160deg,#FFFFFF 0%,#F3F5F9 55%,#E6EAF1 100%)",light:1}
  ];
  var K="wl_theme", CK="wl_custom_themes";
  var H=document.getElementById("homeScr"), B=document.getElementById("themeBtn");
  if(!B||!H) return;
  var IN=B.querySelector(".t-in"), SH=document.getElementById("thSheet"),
      FU=document.getElementById("thFile"), TB=document.getElementById("thThumbs"),
      CL=document.getElementById("thClose");
  var custom=[];
  try{ custom=JSON.parse(localStorage.getItem(CK)||"[]")||[]; }catch(e){ custom=[]; }
  var i=parseInt(localStorage.getItem(K)||"0",10);
  if(isNaN(i)||i<0) i=0;

  function list(){
    var L=TH.slice();
    for(var n=0;n<custom.length;n++){
      L.push({n:"相片"+(n+1), g:"url("+custom[n].d+") center/cover no-repeat", light:(custom[n].lum>0.58), custom:true});
    }
    return L;
  }
  function save(){ try{ localStorage.setItem(CK, JSON.stringify(custom)); }catch(e){ alert("相片太大，這台裝置存不下，換一張小一點的試試。"); } }
  function apply(){
    var L=list(); if(i>=L.length) i=0; var t=L[i];
    H.style.setProperty("--wbg", t.g);
    if(t.light){ H.classList.add("th-light"); } else { H.classList.remove("th-light"); }
    IN.style.background=t.g; IN.style.backgroundSize="cover";
    try{ localStorage.setItem(K,String(i)); }catch(e){}
  }
  function renderThumbs(){
    if(!TB) return;
    TB.innerHTML="";
    for(var n=0;n<custom.length;n++){
      (function(idx){
        var d=document.createElement("div");
        d.className="ts-th"; d.style.backgroundImage="url("+custom[idx].d+")";
        var x=document.createElement("div"); x.className="x"; x.textContent="✕";
        x.addEventListener("click", function(ev){
          ev.stopPropagation(); ev.preventDefault();
          custom.splice(idx,1); save();
          if(i>=list().length) i=0;
          apply(); renderThumbs();
        });
        d.appendChild(x); TB.appendChild(d);
      })(n);
    }
  }
  function openSheet(){ if(!SH) return; SH.classList.add("on"); renderThumbs(); }
  function closeSheet(){ if(!SH) return; SH.classList.remove("on"); }

  var lpT=null, lpDone=false, holdX=0, holdY=0, holding=false, HOLDMS=2000, tapT=null;
  function lpStart(e){
    if(e && e.touches && e.touches.length>1) return;
    var t=(e && (e.touches&&e.touches[0] || e.changedTouches&&e.changedTouches[0])) || e || {};
    holdX=t.clientX||0; holdY=t.clientY||0; holding=true; lpDone=false;
    try{ if(e && e.pointerId!==undefined && B.setPointerCapture) B.setPointerCapture(e.pointerId); }catch(err){}
    clearTimeout(lpT);
    lpT=setTimeout(function(){ if(!holding) return; lpDone=true; holding=false; try{ if(navigator.vibrate) navigator.vibrate(30); }catch(err){} openSheet(); }, HOLDMS);
  }
  function lpMove(e){
    if(!holding) return;
    var t=(e && (e.touches&&e.touches[0] || e.changedTouches&&e.changedTouches[0])) || e || {};
    var dx=(t.clientX||0)-holdX, dy=(t.clientY||0)-holdY;
    if(dx*dx+dy*dy > 676){ holding=false; clearTimeout(lpT); }
  }
  function lpEnd(){ holding=false; clearTimeout(lpT); }
  B.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  ["pointerdown","touchstart","mousedown"].forEach(function(ev){ B.addEventListener(ev, lpStart, {passive:true}); });
  ["pointermove","touchmove"].forEach(function(ev){ B.addEventListener(ev, lpMove, {passive:true}); });
  ["pointerup","touchend","mouseup"].forEach(function(ev){ B.addEventListener(ev, lpEnd, {passive:true}); });
  ["selectstart","dragstart"].forEach(function(ev){
    B.addEventListener(ev, function(e){ e.preventDefault(); });
    if(SH) SH.addEventListener(ev, function(e){ e.preventDefault(); });
  });
  window.addEventListener("scroll", lpEnd, {passive:true});
  B.addEventListener("click", function(){
    if(lpDone){ lpDone=false; return; }
    if(tapT){ clearTimeout(tapT); tapT=null; var L2=list(); i=(i-1+L2.length)%L2.length; apply(); openSheet(); return; }
    tapT=setTimeout(function(){ tapT=null; },350);
    var L=list(); i=(i+1)%L.length; apply();
  });
  if(CL) CL.addEventListener("click", closeSheet);
  if(SH) SH.addEventListener("click", function(e){ if(e.target===SH) closeSheet(); });

  function avgLum(ctx,w,h){
    var d=ctx.getImageData(0,0,w,h).data, n=0, sum=0;
    for(var p=0;p<d.length;p+=4*8){
      sum += (0.299*d[p] + 0.587*d[p+1] + 0.114*d[p+2])/255; n++;
    }
    return n ? sum/n : 0.5;
  }
  if(FU) FU.addEventListener("change", function(){
    var f=FU.files && FU.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var max=1400, w=im.width, h=im.height;
        if(Math.max(w,h)>max){ var sc=max/Math.max(w,h); w=Math.round(w*sc); h=Math.round(h*sc); }
        var c=document.createElement("canvas"); c.width=w; c.height=h;
        var cx=c.getContext("2d"); cx.drawImage(im,0,0,w,h);
        var d=c.toDataURL("image/jpeg",0.72);
        var lum=avgLum(cx,w,h);
        custom.push({d:d,lum:lum});
        if(custom.length>4) custom.shift();
        save(); i=list().length-1; apply(); renderThumbs(); closeSheet();
      };
      im.onerror=function(){ alert("這張圖片讀不進來，換一張試試。"); };
      im.src=r.result;
    };
    r.readAsDataURL(f);
    FU.value="";
  });

  apply();
})();
</script>
<script>
/* 開頁自檢：偵測到新版就自動重載一次，不需重新下載或更換 App */
(function(){
  try{
    var K="wl_page_build";
    fetch("/worklog/assets/pages-version.json?t="+Date.now(),{cache:"no-store"})
      .then(function(r){return r.json();})
      .then(function(j){
        var b=String(j.build||""); if(!b) return;
        var old=null;
        try{ old=localStorage.getItem(K); }catch(e){}
        try{ localStorage.setItem(K,b); }catch(e){}
        if(old && old!==b){
          var base=location.pathname.replace(/index\.html$/,"");
          location.replace(base+"?upd="+encodeURIComponent(b));
        }
      })
      .catch(function(){});
  }catch(e){}
})();
</script>
<script>
/* 版本自癒：這一頁自己記住自己的 build，跟線上 pages-version.json 不同就帶 ?v= 重載一次
   （iOS Safari／加到主畫面最容易卡舊快取，這一段不依賴 localStorage，避免被其他分頁先寫掉） */
(function(){
  var MY_BUILD="20261118131918";
  var KEY="wl_selfver", TRIES=0, busy=false;
  function go(b){
    if(busy) return; busy=true;
    try{
      if(sessionStorage.getItem(KEY)===b) return;
      sessionStorage.setItem(KEY,b);
    }catch(e){}
    var dir=location.pathname.replace(/[^/]*$/,"");
    try{ location.replace(dir+"?v="+encodeURIComponent(b)); }catch(e){}
  }
  function check(){
    TRIES++;
    var u="assets/pages-version.json?t="+Date.now();
    fetch(u,{cache:"reload"})
      .then(function(r){ if(!r.ok) throw new Error("bad"); return r.json(); })
      .then(function(j){
        var b=String((j&&j.build)||""); if(!b) return;
        if(b!==MY_BUILD) go(b);
      })
      .catch(function(){ if(TRIES<4) setTimeout(check,2500); });
  }
  check();
  window.addEventListener("pageshow", function(e){ if(e.persisted) check(); });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && TRIES<2) check(); });
})();
</script>
